services:
  bubblarr:
    container_name: bubblarr
    build: .
    image: bubblarr:latest
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - "bubblarr-db:/app/db"
      - "/path/to/download_folder:/app/temp_downloads"
      - "/path/to/comics:/comics"
    ports:
      - 5656:5656

volumes:
  bubblarr-db:
