<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Bubblarr</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a990f2"/>
      <stop offset="1" stop-color="#5a3eb5"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f2a8c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3f2a8c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dcfb"/>
      <stop offset="1" stop-color="#bfb0ee"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 128 128)">
    <!-- Pages peeking out behind the cover -->
    <rect x="52" y="20" width="172" height="222" rx="13" fill="url(#pages)"/>
    <!-- Cover -->
    <rect x="34" y="10" width="172" height="222" rx="13" fill="url(#cover)"/>
    <!-- Spine shading and fold -->
    <rect x="34" y="10" width="36" height="222" rx="13" fill="url(#spine)"/>
    <path d="M53 20 V222" stroke="#ffffff" stroke-opacity=".35" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Masthead -->
    <rect x="70" y="30" width="118" height="24" rx="6" fill="#ffffff" fill-opacity=".92"/>
    <!-- Speech bubble -->
    <path d="M128 74 C164 74 190 95 190 122 C190 149 164 170 128 170 C121 170 114 169 108 167 L84 186 L90 158 C75 149 66 136 66 122 C66 95 92 74 128 74 Z"
      fill="#ffffff"/>
    <!-- Lightning bolt -->
    <path d="M137 86 L106 128 H126 L118 158 L150 114 H130 Z" fill="url(#cover)"/>
  </g>
</svg>
